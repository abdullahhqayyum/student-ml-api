name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Extract version from Git tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        shell: bash
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          docker build \
            --build-arg APP_VERSION=${{ steps.version.outputs.version }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE="$BUILD_DATE" \
            -t ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ steps.version.outputs.version }} \
            -t ghcr.io/${{ github.repository_owner }}/student-ml-api:latest \
            -t ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ github.sha }} \
            .

      - name: Push Docker images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ steps.version.outputs.version }}
          docker push ghcr.io/${{ github.repository_owner }}/student-ml-api:latest
          docker push ghcr.io/${{ github.repository_owner }}/student-ml-api:${{ github.sha }}
